services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://smartbiz:smartbiz_dev@db:5432/smartbiz
      JWT_SECRET: local-only-smartbiz-secret-change-before-deployment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartbiz
      POSTGRES_USER: smartbiz
      POSTGRES_PASSWORD: smartbiz_dev
    ports:
      - "5432:5432"
    volumes:
      - smartbiz_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbiz -d smartbiz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  smartbiz_db:
