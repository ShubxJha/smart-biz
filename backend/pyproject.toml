[project]
name = "smartbiz-api"
version = "0.1.0"
description = "Sales management and analytics API for SmartBiz"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pwdlib[argon2]>=0.2,<1",
    "pyjwt>=2.10,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
